---
apiVersion: appstudio.redhat.com/v1alpha1
kind: Release
metadata:
  name: lvm-operator-rhba-v5.0.0
  namespace: logical-volume-manag-tenant
  labels:
    release.appstudio.openshift.io/author: "Minal Pradeep Makwana <mmakwana@redhat.com>"
spec:
  releasePlan: lvm-operator-production-releaseplan-5-0
  snapshot: lvm-operator-5-0-20261030-093525-000
  data:
    releaseNotes:
      description: |
        After a successful LVMS upgrade, the latest lvms-operator SHA image should be running.

        This erratum implements the following changes:

        - Adds support for software RAID configuration on LVMCluster device classes, allowing declarative configuration of RAID levels (e.g. RAID1, RAID5) with stripes and mirrors options for thick-provisioned volumes
        - Supports day-2 replacement of a failed disk in a RAID array without interrupting workloads

        Users of LVMS are advised to upgrade to the latest version in OpenShift Container Platform, which fixes these bugs and adds these enhancements.
      issues:
        fixed:
          - id: OCPSTRAT-2897
            source: issues.redhat.com
