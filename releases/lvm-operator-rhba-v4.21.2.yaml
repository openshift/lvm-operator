  releasePlan: lvm-operator-production-releaseplan-4-21
  snapshot: lvm-operator-4-21-20261014-083050-000
  data:
    releaseNotes:
      description: |
        After a successful LVMS upgrade, the latest lvms-operator SHA image should be running.

        This erratum is a security maintenance release that implements the following changes:

        - Refreshes the operator base RPM packages (including openssl, systemd, pam and expat) to the latest RHEL 9 security errata
        - Updates the UBI Minimal base image to its latest digest to pick up operating system security fixes
        - Updates the must-gather base image to its latest digest
        - Golang version bump to address CVE-2025-68121, CVE-2026-32283, CVE-2026-56858, CVE-2026-56859, CVE-2026-56860, CVE-2026-56862 and CVE-2026-33818

        Users of LVMS are advised to upgrade to the latest version in OpenShift Container Platform, which fixes these bugs and adds these enhancements.
      cves:
